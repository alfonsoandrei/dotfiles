[opener]
mdfried = [
	{ run = "mdfried %s1", desc = "mdfried", for = "unix", block = true },
]

[open]
prepend_rules = [
	{ url = "*.{md,markdown}", use = [ "edit", "mdfried", "reveal" ] },
]

[[plugin.prepend_previewers]]
url = "*.{md,markdown}"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'
